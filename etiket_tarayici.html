<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Aksesuar Tarayıcı - Teşhis Sürümü</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #009999;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Hata Logları Ekranı */
        #debug-log {
            position: absolute; top: 0; left: 0; width: 100%; height: 30%; 
            background: rgba(0, 0, 0, 0.85); color: #00ff00; font-family: monospace; 
            font-size: 11px; padding: 10px; overflow-y: auto; z-index: 9999; pointer-events: none;
        }

        #camera-container { flex: 1; background-color: #000; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        /* playsinline ve muted mobil tarayıcılar için kritik */
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }
        
        .scan-frame { position: absolute; width: 80%; height: 40%; border: 2px dashed rgba(255, 255, 255, 0.5); border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4); pointer-events: none; }

        #action-bar { height: 80px; background-color: var(--surface-color); display: flex; justify-content: center; align-items: center; position: relative; z-index: 10; }
        #capture-btn { width: 64px; height: 64px; border-radius: 50%; background-color: var(--primary-color); border: 4px solid var(--surface-color); outline: 2px solid var(--primary-color); cursor: pointer; transition: transform 0.1s; }
        #capture-btn:active { transform: scale(0.95); }

        #list-container { flex: 1; background-color: var(--surface-color); padding: 15px; overflow-y: auto; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .header-row h2 { font-size: 16px; font-weight: 600; color: var(--text-muted); }
        .counter { background-color: var(--primary-color); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 14px; font-weight: bold; }

        #api-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--surface-color); padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 15px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; }
        .modal-content button { width: 100%; padding: 10px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="debug-log">Sistem başlatılıyor...<br></div>

    <div id="api-modal" class="hidden">
        <div class="modal-content">
            <h3>Sistem Kurulumu</h3>
            <input type="text" id="api-key-input" placeholder="AIzaSy...">
            <button onclick="saveApiKey()">Kaydet ve Başla</button>
        </div>
    </div>

    <div id="camera-container">
        <!-- Kamera akışı için en uyumlu etiket yapısı -->
        <video id="camera-feed" autoplay playsinline muted></video>
        <div class="scan-frame"></div>
    </div>

    <div id="action-bar">
        <button id="capture-btn" onclick="captureImage()"></button>
    </div>

    <div id="list-container">
        <div class="header-row">
            <h2>TARANAN PANOLAR</h2>
            <div class="counter" id="total-count">0</div>
        </div>
        <div id="scanned-list" style="color: var(--text-muted); font-size: 14px; text-align: center; margin-top: 20px;">Henüz tarama yapılmadı.</div>
    </div>

    <script>
        // Teşhis loglarını ekrana yazdırma fonksiyonu
        const logDiv = document.getElementById('debug-log');
        function sysLog(msg) {
            logDiv.innerHTML += `> ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function checkApiKey() {
            sysLog("API Key kontrol ediliyor...");
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                sysLog("API Key bulunamadı, modal açılıyor.");
                document.getElementById('api-modal').classList.remove('hidden');
            } else {
                sysLog("API Key mevcut, kamera başlatılıyor.");
                startCamera();
            }
        }

        function saveApiKey() {
            const input = document.getElementById('api-key-input').value.trim();
            if (input) {
                localStorage.setItem('gemini_api_key', input);
                document.getElementById('api-modal').classList.add('hidden');
                sysLog("API Key kaydedildi.");
                startCamera();
            }
        }

        async function startCamera() {
            sysLog("Kamera izinleri isteniyor...");
            const videoElement = document.getElementById('camera-feed');
            
            // Tarayıcı desteği kontrolü
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                sysLog("HATA: Tarayıcı kamerayı desteklemiyor (HTTPS değil veya eski sürüm).");
                return;
            }

            try {
                // Daha esnek kamera kısıtlaması (ideal kullanımı)
                const constraints = { video: { facingMode: { ideal: "environment" } } };
                sysLog("Hedef: Arka kamera (ideal: environment)");
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                sysLog("Kamera izni alındı, stream bağlandı.");
                
                videoElement.srcObject = stream;
                
                // Video oynamaya başladığında log at
                videoElement.onloadedmetadata = () => {
                    sysLog(`Video metadata yüklendi. Boyut: ${videoElement.videoWidth}x${videoElement.videoHeight}`);
                    videoElement.play().then(() => {
                        sysLog("Video oynatılıyor (play successful).");
                    }).catch(e => {
                        sysLog("HATA: Video oynatma reddedildi: " + e.message);
                    });
                };

            } catch (err) {
                sysLog("HATA: Kamera başlatılamadı!");
                sysLog("Detay: " + err.name + " - " + err.message);
            }
        }

        // Önceki captureImage ve addToList fonksiyonları aynı kalıyor, log ekliyoruz
        let totalScanned = 0;

        async function captureImage() {
            sysLog("Fotoğraf çekme tetiklendi.");
            const video = document.getElementById('camera-feed');
            const btn = document.getElementById('capture-btn');
            const apiKey = localStorage.getItem('gemini_api_key');

            if (!apiKey) return alert("API Key bulunamadı!");
            
            if (video.videoWidth === 0) {
                sysLog("HATA: Video genişliği 0. Görüntü yok.");
                return alert("Kamera görüntüsü henüz yüklenmedi.");
            }

            btn.style.backgroundColor = "orange";
            btn.disabled = true;

            try {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                sysLog("Fotoğraf çekildi ve Base64'e çevrildi. Gemini'ye gönderiliyor...");

                const promptText = `Bu bir Siemens aksesuar etiketi. Şu bilgileri JSON olarak ver:\n- siparis_no: En üstteki 10 haneli sayı (70 ile başlar)\n- upper_list: UPPER LIST satırındaki 8PQ... kodu\n- part_no: PART NO satırındaki 8PQ... kodu\n- panel_no: PANEL NO satırındaki değer (sayı veya Accessories Kit)\nSadece JSON döndür, başka hiçbir şey yazma.`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: "image/jpeg", data: imageData } }] }],
                        generationConfig: { response_mime_type: "application/json" }
                    })
                });

                const data = await response.json();
                sysLog("Gemini'den yanıt geldi.");
                
                if (data.candidates && data.candidates[0].content) {
                    let result = JSON.parse(data.candidates[0].content.parts[0].text);
                    let panoNo = result.panel_no || "Accessories Kit";
                    if (panoNo.toString().trim() === "") panoNo = "Accessories Kit";
                    sysLog(`Başarılı: Pano ${panoNo} okundu.`);
                    addToList(result.siparis_no, panoNo, result.part_no);
                } else {
                    sysLog("HATA: Etiket okunamadı (Yapay Zeka boş döndü).");
                }
            } catch (error) {
                sysLog("HATA (API/Ağ): " + error.message);
            } finally {
                btn.style.backgroundColor = "var(--primary-color)";
                btn.disabled = false;
            }
        }

        function addToList(siparis, pano, parca) {
            const listContainer = document.getElementById('scanned-list');
            if (totalScanned === 0) listContainer.innerHTML = "";
            totalScanned++;
            document.getElementById('total-count').innerText = totalScanned;

            const item = document.createElement('div');
            item.style.backgroundColor = "#2a2a2a";
            item.style.padding = "10px"; item.style.marginBottom = "10px"; item.style.borderRadius = "6px";
            item.style.borderLeft = "4px solid var(--primary-color)";
            item.innerHTML = `<div style="font-weight: bold; color: white; margin-bottom: 4px;">Pano: ${pano}</div><div style="font-size: 12px; color: var(--text-muted);">Sipariş: ${siparis} | Parça: ${parca}</div>`;
            listContainer.prepend(item);
        }

        window.onload = checkApiKey;
    </script>
</body>
</html>
