<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Etiket Tarayıcı</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #2a2a3a;
    --accent: #00e5ff;
    --accent2: #ff6b35;
    --green: #00ff88;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --danger: #ff4560;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }
  .header h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .header .count-badge {
    background: var(--accent);
    color: var(--bg);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 1px;
  }

  /* CAMERA */
  .camera-section {
    position: relative;
    width: 100%;
    background: #000;
  }
  #video {
    width: 100%;
    max-height: 55vh;
    object-fit: cover;
    display: block;
  }

  /* Scan overlay */
  .scan-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .scan-frame {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 82%;
    height: 42%;
    border: 2px solid var(--accent);
    border-radius: 4px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
  }
  .scan-frame::before,
  .scan-frame::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--accent);
    border-style: solid;
  }
  .scan-frame::before { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
  .scan-frame::after  { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }

  .scan-line {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 82%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: scanMove 2s ease-in-out infinite;
    top: 29%;
  }
  @keyframes scanMove {
    0%   { top: 29%; opacity: 1; }
    50%  { top: 71%; opacity: 0.7; }
    100% { top: 29%; opacity: 1; }
  }

  /* STATUS */
  .status-bar {
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 46px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.scanning { background: var(--accent); animation: pulse 1s infinite; }
  .status-dot.ok       { background: var(--green); }
  .status-dot.error    { background: var(--danger); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .status-text { font-size: 12px; color: var(--muted); flex: 1; }
  .status-text strong { color: var(--text); }

  /* RESULT PREVIEW */
  .result-preview {
    display: none;
    margin: 12px 16px;
    padding: 12px 14px;
    background: rgba(0,229,255,0.06);
    border: 1px solid var(--accent);
    border-radius: 6px;
  }
  .result-preview.show { display: block; }
  .result-row { display: flex; gap: 8px; margin-bottom: 4px; font-size: 12px; }
  .result-label { color: var(--muted); min-width: 90px; }
  .result-value { color: var(--accent); font-weight: 700; letter-spacing: 1px; }
  .result-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn-confirm {
    flex: 1; padding: 10px;
    background: var(--green); color: #000;
    border: none; border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 13px; font-weight: 700;
    cursor: pointer; letter-spacing: 1px;
  }
  .btn-retry {
    flex: 1; padding: 10px;
    background: transparent; color: var(--danger);
    border: 1px solid var(--danger); border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 13px; font-weight: 700;
    cursor: pointer; letter-spacing: 1px;
  }

  /* PANELS LIST */
  .panels-section {
    padding: 12px 16px;
  }
  .panels-title {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .panel-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 6px;
    transition: border-color 0.2s;
  }
  .panel-item.new-item {
    border-color: var(--green);
    animation: flashIn 0.5s ease;
  }
  @keyframes flashIn {
    0%   { background: rgba(0,255,136,0.2); }
    100% { background: var(--surface); }
  }
  .panel-name { font-size: 13px; font-weight: 700; color: var(--accent); }
  .panel-siparis { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .panel-count {
    background: var(--border);
    color: var(--text);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 12px;
  }

  /* BOTTOM ACTIONS */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }
  .btn-zip {
    flex: 1; padding: 14px;
    background: var(--accent2); color: #fff;
    border: none; border-radius: 6px;
    font-family: 'Courier New', monospace;
    font-size: 14px; font-weight: 700;
    cursor: pointer; letter-spacing: 2px;
    text-transform: uppercase;
  }
  .btn-zip:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-clear {
    padding: 14px 18px;
    background: transparent; color: var(--danger);
    border: 1px solid var(--danger); border-radius: 6px;
    font-family: 'Courier New', monospace;
    font-size: 13px; font-weight: 700;
    cursor: pointer;
  }

  .empty-state {
    text-align: center;
    padding: 30px 20px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
  }
  .empty-state .icon { font-size: 32px; margin-bottom: 10px; }

  .pb-bottom { padding-bottom: 80px; }

  /* Loading overlay */
  #ocr-loading {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(10,10,15,0.85);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    z-index: 10;
  }
  #ocr-loading.show { display: flex; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 12px; color: var(--accent); letter-spacing: 2px; }
</style>
</head>
<body>

<div class="header">
  <h1>ETİKET TARAYICI</h1>
  <div class="count-badge" id="totalBadge">0 ADET</div>
</div>

<div class="camera-section">
  <video id="video" autoplay playsinline muted></video>
  <div class="scan-overlay">
    <div class="scan-frame"></div>
    <div class="scan-line"></div>
  </div>
  <div id="ocr-loading">
    <div class="spinner"></div>
    <div class="loading-text">OKUNUYOR...</div>
  </div>
</div>

<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <div class="status-text" id="statusText">Kamera başlatılıyor...</div>
</div>

<div class="result-preview" id="resultPreview">
  <div class="result-row">
    <span class="result-label">SİPARİŞ NO</span>
    <span class="result-value" id="rSiparis">—</span>
  </div>
  <div class="result-row">
    <span class="result-label">UPPER LIST</span>
    <span class="result-value" id="rUpper">—</span>
  </div>
  <div class="result-row">
    <span class="result-label">PART NO</span>
    <span class="result-value" id="rPart">—</span>
  </div>
  <div class="result-row">
    <span class="result-label">PANEL NO</span>
    <span class="result-value" id="rPanel">—</span>
  </div>
  <div class="result-actions">
    <button class="btn-confirm" onclick="confirmResult()">✓ KAYDET</button>
    <button class="btn-retry"   onclick="retryResult()">↺ TEKRAR</button>
  </div>
</div>

<div class="panels-section pb-bottom">
  <div class="panels-title">Taranan Panolar</div>
  <div id="panelsList">
    <div class="empty-state">
      <div class="icon">📦</div>
      <div>Henüz taranmış etiket yok</div>
      <div style="margin-top:6px">Etiketi çerçeve içine getirin</div>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <button class="btn-zip" id="zipBtn" onclick="downloadZip()" disabled>ZIP İNDİR</button>
  <button class="btn-clear" onclick="clearAll()">SİL</button>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
// ── STATE ────────────────────────────────────────────────────────────────────
const state = {
  panels: {},        // { "Pano_01_7024055700": [ {name, blob} ] }
  totalCount: 0,
  scanning: true,
  lastResult: null,
  capturedBlob: null,
  worker: null,
  scanInterval: null,
  cooldown: false,
};

// ── OCR WORKER ───────────────────────────────────────────────────────────────
async function initOCR() {
  setStatus('scanning', 'OCR motoru yükleniyor...');
  state.worker = await Tesseract.createWorker('eng', 1, {
    logger: () => {}
  });
  await state.worker.setParameters({
    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:/ .-_',
  });
  setStatus('scanning', 'Etiketi çerçeve içine getirin');
  startAutoScan();
}

// ── CAMERA ───────────────────────────────────────────────────────────────────
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment',
        width: { ideal: 1920 },
        height: { ideal: 1080 },
      }
    });
    document.getElementById('video').srcObject = stream;
    await initOCR();
  } catch(e) {
    setStatus('error', 'Kamera erişimi reddedildi: ' + e.message);
  }
}

// ── AUTO SCAN ────────────────────────────────────────────────────────────────
function startAutoScan() {
  state.scanInterval = setInterval(async () => {
    if (!state.scanning || state.cooldown) return;
    const result = await captureAndOCR();
    if (result && result.siparis && result.panel) {
      state.cooldown = true;
      showResult(result);
    }
  }, 2500);
}

async function captureAndOCR() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  if (video.readyState < 2) return null;

  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;

  // Çerçeveye karşılık gelen video alanını kırp (%82 genişlik, %42 yükseklik, ortalı)
  const cropW = Math.floor(vw * 0.82);
  const cropH = Math.floor(vh * 0.42);
  const cropX = Math.floor((vw - cropW) / 2);
  const cropY = Math.floor((vh - cropH) / 2);

  canvas.width  = cropW;
  canvas.height = cropH;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

  // Kontrast artır
  ctx.filter = 'contrast(1.4) brightness(1.1)';
  ctx.drawImage(canvas, 0, 0);
  ctx.filter = 'none';

  document.getElementById('ocr-loading').classList.add('show');

  try {
    const { data: { text } } = await state.worker.recognize(canvas);
    document.getElementById('ocr-loading').classList.remove('show');
    return parseLabel(text);
  } catch(e) {
    document.getElementById('ocr-loading').classList.remove('show');
    return null;
  }
}

// ── PARSE ────────────────────────────────────────────────────────────────────
function parseLabel(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  let siparis = '', upper = '', part = '', panel = '';

  for (const line of lines) {
    const up = line.toUpperCase();

    // Sipariş no: 7 haneli+ sayı (70240 ile başlar genellikle)
    if (!siparis) {
      const m = line.match(/\b(70\d{8,}|\d{10,})\b/);
      if (m) { siparis = m[1]; continue; }
    }

    // UPPER LIST
    if (up.includes('UPPER') || up.includes('UPPE')) {
      const m = line.match(/[:\s]+([8][A-Z0-9\-]+)/);
      if (m) upper = m[1];
      continue;
    }

    // PART NO
    if (up.includes('PART') && !up.includes('PANEL')) {
      const m = line.match(/[:\s]+([8][A-Z0-9\-]+)/);
      if (m) part = m[1];
      continue;
    }

    // PANEL NO
    if (up.includes('PANEL')) {
      const m = line.match(/PANEL\s*NO\s*[:\s]*(\w+)/i);
      if (m) panel = m[1].replace(/^0+/, '') || '0'; // leading zeros kaldır
      // Accessories Kit
      if (!panel && up.includes('ACCESSORIES')) panel = 'Accessories Kit';
      continue;
    }
  }

  // Panel bulunamadıysa tek başına sayı satırı ara
  if (!panel) {
    for (const line of lines) {
      if (/^\d{1,3}$/.test(line)) { panel = line; break; }
    }
  }

  if (!siparis || !panel) return null;
  return { siparis, upper, part, panel, raw: text };
}

// ── SHOW RESULT ───────────────────────────────────────────────────────────────
async function showResult(result) {
  state.scanning = false;
  state.lastResult = result;

  // Fotoğrafı kaydet
  const canvas = document.getElementById('canvas');
  state.capturedBlob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.88));

  document.getElementById('rSiparis').textContent = result.siparis;
  document.getElementById('rUpper').textContent   = result.upper || '—';
  document.getElementById('rPart').textContent    = result.part  || '—';
  document.getElementById('rPanel').textContent   = 'Pano ' + result.panel;

  document.getElementById('resultPreview').classList.add('show');
  setStatus('ok', `<strong>Pano ${result.panel}</strong> okundu — kaydet veya tekrar çek`);
}

function confirmResult() {
  const r = state.lastResult;
  if (!r) return;

  const key = `${r.siparis}_Pano_${r.panel.toString().padStart(2,'0')}`;
  if (!state.panels[key]) state.panels[key] = [];

  const idx = state.panels[key].length + 1;
  const filename = `${key}_${String(idx).padStart(3,'0')}.jpg`;
  state.panels[key].push({ name: filename, blob: state.capturedBlob });

  state.totalCount++;
  document.getElementById('totalBadge').textContent = state.totalCount + ' ADET';
  document.getElementById('zipBtn').disabled = false;

  renderPanels(key);
  retryResult();
}

function retryResult() {
  document.getElementById('resultPreview').classList.remove('show');
  state.lastResult = null;
  state.capturedBlob = null;
  state.scanning = true;
  state.cooldown = false;
  setStatus('scanning', 'Etiketi çerçeve içine getirin');
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function renderPanels(newKey) {
  const list = document.getElementById('panelsList');
  const keys = Object.keys(state.panels).sort();
  if (!keys.length) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📦</div><div>Henüz taranmış etiket yok</div></div>`;
    return;
  }

  list.innerHTML = keys.map(k => {
    const parts = k.split('_');
    const siparis = parts[0];
    const pano = parts.slice(1).join(' ');
    const count = state.panels[k].length;
    const isNew = k === newKey;
    return `<div class="panel-item ${isNew ? 'new-item' : ''}">
      <div>
        <div class="panel-name">${pano.replace(/_/g,' ')}</div>
        <div class="panel-siparis">${siparis}</div>
      </div>
      <div class="panel-count">${count} foto</div>
    </div>`;
  }).join('');
}

// ── ZIP ───────────────────────────────────────────────────────────────────────
async function downloadZip() {
  const btn = document.getElementById('zipBtn');
  btn.textContent = 'HAZIRLANIYOR...';
  btn.disabled = true;

  const zip = new JSZip();
  for (const [key, files] of Object.entries(state.panels)) {
    const folder = zip.folder(key);
    for (const f of files) {
      folder.file(f.name, f.blob);
    }
  }

  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `Etiketler_${Date.now()}.zip`;
  a.click();
  URL.revokeObjectURL(url);

  btn.textContent = 'ZIP İNDİR';
  btn.disabled = false;
}

// ── CLEAR ─────────────────────────────────────────────────────────────────────
function clearAll() {
  if (!confirm('Tüm taranan etiketler silinecek. Emin misiniz?')) return;
  state.panels = {};
  state.totalCount = 0;
  document.getElementById('totalBadge').textContent = '0 ADET';
  document.getElementById('zipBtn').disabled = true;
  renderPanels(null);
  retryResult();
}

// ── STATUS ────────────────────────────────────────────────────────────────────
function setStatus(type, msg) {
  const dot  = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.className  = 'status-dot ' + type;
  text.innerHTML = msg;
}

// ── INIT ─────────────────────────────────────────────────────────────────────
startCamera();
</script>
</body>
</html>
