<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<title>Etiket Tarayıcı</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f0f;--s1:#1a1a1a;--s2:#222;
  --accent:#00c9a7;--red:#ff4757;--text:#fff;--muted:#666;--border:#2a2a2a;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;overflow:hidden}
.screen{display:none;flex-direction:column;height:100vh;height:100dvh}
.screen.active{display:flex}

/* ── SİPARİŞ GİRİŞ EKRANI ── */
#sipScreen{align-items:center;justify-content:center;padding:30px 24px;gap:20px}
#sipScreen .logo{font-size:13px;font-weight:700;letter-spacing:3px;color:var(--accent);text-align:center}
#sipScreen h2{font-size:22px;font-weight:700;text-align:center}
#sipScreen p{font-size:13px;color:var(--muted);text-align:center}
#sipInput{
  width:100%;padding:16px;
  background:var(--s1);border:1.5px solid var(--border);
  color:var(--text);border-radius:10px;
  font-size:18px;font-family:monospace;text-align:center;
  outline:none;letter-spacing:2px;
}
#sipInput:focus{border-color:var(--accent)}
#sipBtn{
  width:100%;padding:16px;
  background:var(--accent);color:#000;
  border:none;border-radius:10px;
  font-size:17px;font-weight:700;cursor:pointer;
  letter-spacing:1px;
}
#sipBtn:active{opacity:.85}

/* ── TARAMA EKRANI ── */
#scanScreen{flex-direction:column}

/* Header */
.hdr{
  flex-shrink:0;height:46px;
  background:var(--s1);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;
}
.hdr-sip{font-size:13px;font-weight:700;color:var(--accent);font-family:monospace}
.hdr-cnt{font-size:11px;color:var(--muted)}
.hdr-menu{display:flex;gap:6px}
.hbtn{padding:5px 10px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:11px;cursor:pointer}
.hbtn.zip{border-color:var(--accent);color:var(--accent)}
.hbtn:disabled{opacity:.3;cursor:not-allowed}

/* Camera */
#camWrap{
  flex-shrink:0;position:relative;
  background:#000;overflow:hidden;
}
video{width:100%;height:100%;object-fit:cover;display:block}

/* Preview overlay */
#prevImg{
  position:absolute;inset:0;
  width:100%;height:100%;object-fit:cover;
  display:none;z-index:5;
}
/* Capture flash */
#flash{
  position:absolute;inset:0;background:#fff;
  opacity:0;pointer-events:none;z-index:8;
  transition:opacity .15s;
}

/* Capture button area */
.cam-bar{
  position:absolute;bottom:0;left:0;right:0;
  height:70px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(transparent,rgba(0,0,0,.6));
  z-index:6;
}
#capBtn{
  width:62px;height:62px;border-radius:50%;
  background:rgba(255,255,255,.15);
  border:3px solid rgba(255,255,255,.8);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .1s;
  backdrop-filter:blur(4px);
}
#capBtn:active{transform:scale(.9)}
#capBtn svg{pointer-events:none}

/* PANO SEÇİM ALANI */
#panoArea{
  flex:1;overflow-y:auto;
  background:var(--bg);
  padding:10px 10px 10px;
  display:flex;flex-direction:column;gap:8px;
}

/* Çekilen fotoğraf küçük önizleme */
#thumbWrap{
  display:none;flex-shrink:0;
  align-items:center;gap:10px;
  padding:8px 10px;
  background:var(--s1);border-radius:8px;
  border:1px solid var(--border);
}
#thumb{width:52px;height:40px;object-fit:cover;border-radius:4px;flex-shrink:0}
#thumbInfo{flex:1}
#thumbInfo .ti-lbl{font-size:10px;color:var(--muted);letter-spacing:1px}
#thumbInfo .ti-val{font-size:13px;font-weight:700;color:var(--accent);margin-top:2px}
#confirmBtn{
  width:48px;height:48px;border-radius:50%;flex-shrink:0;
  background:#1a3d2e;border:2px solid #00c9a7;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;
}
#confirmBtn.active{background:var(--accent);}
#confirmBtn:active{transform:scale(.9)}
#confirmBtn svg{pointer-events:none}

/* Pano butonları */
.pano-label{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--muted);padding:0 2px}
.pano-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}
.pno{
  aspect-ratio:1;
  background:var(--s1);border:1.5px solid var(--border);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;
  cursor:pointer;transition:all .15s;
  user-select:none;
}
.pno:active{transform:scale(.92)}
.pno.sel{
  background:rgba(0,201,167,.15);
  border-color:var(--accent);color:var(--accent);
  box-shadow:0 0 12px rgba(0,201,167,.2);
}

/* Manuel giriş */
.manual-wrap{display:flex;gap:6px;align-items:center}
#manualInput{
  flex:1;padding:10px 12px;
  background:var(--s1);border:1.5px solid var(--border);
  color:var(--text);border-radius:8px;
  font-size:14px;font-family:monospace;outline:none;
}
#manualInput:focus{border-color:var(--accent)}
#manualInput::placeholder{color:var(--muted)}

/* Durum mesajı */
#statusMsg{
  text-align:center;font-size:11px;
  color:var(--muted);padding:4px;
  min-height:20px;letter-spacing:.5px;
}
#statusMsg.ok{color:var(--accent)}
#statusMsg.err{color:var(--red)}

/* ── BİTİŞ EKRANI ── */
#doneScreen{align-items:center;justify-content:center;padding:30px 24px;gap:16px;text-align:center}
#doneScreen .big{font-size:48px}
#doneScreen h2{font-size:20px;font-weight:700}
#doneScreen p{font-size:13px;color:var(--muted);line-height:1.7}
.done-grid{display:grid;gap:10px;width:100%}
.dbtn{
  width:100%;padding:15px;border:none;border-radius:10px;
  font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.5px;
}
.dbtn.primary{background:var(--accent);color:#000}
.dbtn.secondary{background:var(--s1);color:var(--text);border:1px solid var(--border)}
.dbtn:active{opacity:.85}

canvas{display:none}
</style>
</head>
<body>

<!-- 1. SİPARİŞ GİRİŞ -->
<div class="screen active" id="sipScreen">
  <div class="logo">ETİKET TARAYICI</div>
  <h2>Sipariş Numarası</h2>
  <p>Taramaya başlamak için sipariş numarasını girin</p>
  <input id="sipInput" type="tel" placeholder="7024055700" maxlength="15" autocomplete="off">
  <button id="sipBtn" onclick="startScan()">BAŞLAT →</button>
</div>

<!-- 2. TARAMA -->
<div class="screen" id="scanScreen">
  <div class="hdr">
    <div class="hdr-sip" id="hdrSip">—</div>
    <div class="hdr-cnt" id="hdrCnt">0 fotoğraf</div>
    <div class="hdr-menu">
      <button class="hbtn zip" id="zipBtn" onclick="goToFinish()" disabled>ZIP →</button>
      <button class="hbtn" onclick="confirmReset()">↺ Sıfırla</button>
    </div>
  </div>

  <div id="camWrap">
    <video id="video" playsinline muted autoplay></video>
    <img id="prevImg" alt="">
    <div id="flash"></div>
    <div class="cam-bar">
      <div id="capBtn" onclick="capturePhoto()">
        <svg width="26" height="26" viewBox="0 0 26 26">
          <circle cx="13" cy="13" r="9" stroke="white" stroke-width="2.5" fill="none"/>
          <circle cx="13" cy="13" r="4.5" fill="white"/>
        </svg>
      </div>
    </div>
  </div>

  <div id="panoArea">

    <!-- Küçük önizleme + onayla -->
    <div id="thumbWrap">
      <img id="thumb" alt="">
      <div id="thumbInfo">
        <div class="ti-lbl">SEÇİLEN PANO</div>
        <div class="ti-val" id="selectedPanoLbl">— seçilmedi —</div>
      </div>
      <div id="confirmBtn" onclick="savePhoto()">
        <svg width="22" height="22" viewBox="0 0 22 22">
          <polyline points="4,11 9,16 18,6" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <!-- Pano numaraları -->
    <div class="pano-label">PANO NUMARASI</div>
    <div class="pano-grid" id="panoGrid"></div>

    <!-- Manuel -->
    <div class="pano-label">VEYA MANUEL GİR</div>
    <div class="manual-wrap">
      <input id="manualInput" type="text" placeholder="Accessories Kit / özel isim...">
    </div>

    <div id="statusMsg"></div>

  </div>
</div>

<!-- 3. BİTİŞ -->
<div class="screen" id="doneScreen">
  <div class="big">✅</div>
  <h2 id="doneSip">Sipariş Tamamlandı</h2>
  <p id="doneStats">—</p>
  <div class="done-grid">
    <button class="dbtn primary" onclick="downloadZip()">⬇ ZIP İNDİR</button>
    <button class="dbtn secondary" onclick="backToScan()">← Taramaya Dön</button>
    <button class="dbtn secondary" onclick="fullReset()">🗑 Sıfırla & Yeni Sipariş</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script>
/* ── STATE ── */
const ST = {
  siparis: '',
  panels: {},   // { 'PANEL - 01': [{name, blob}], ... }
  total: 0,
  pendingBlob: null,
  selectedPano: null,
};

/* ── EKRAN GEÇİŞLERİ ── */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ── 1. SİPARİŞ BAŞLAT ── */
function startScan(){
  const val = document.getElementById('sipInput').value.trim();
  if(!val){ alert('Sipariş numarası girin.'); return; }
  ST.siparis = val;
  document.getElementById('hdrSip').textContent = val;
  showScreen('scanScreen');
  sizeCam();
  startCam();
  buildPanoGrid();
}

document.getElementById('sipInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') startScan();
});

/* ── KAMERA ── */
function sizeCam(){
  const wrap = document.getElementById('camWrap');
  wrap.style.height = Math.round(window.innerHeight * 0.42) + 'px';
}
window.addEventListener('resize', sizeCam);

async function startCam(){
  const vid = document.getElementById('video');
  const tries = [
    {video:{facingMode:{exact:'environment'}, width:{ideal:1920}, height:{ideal:1080}}},
    {video:{facingMode:'environment'}},
    {video:true}
  ];
  for(const t of tries){
    try{
      const s = await navigator.mediaDevices.getUserMedia(t);
      vid.srcObject = s;
      await new Promise(r=>{ vid.onloadedmetadata=r; });
      vid.play();
      return;
    }catch(e){ console.log('Kamera:', e.message); }
  }
  alert('Kamera açılamadı.');
}

/* ── PANO GRID ── */
function buildPanoGrid(){
  const grid = document.getElementById('panoGrid');
  grid.innerHTML = '';
  for(let i=1; i<=15; i++){
    const div = document.createElement('div');
    div.className = 'pno';
    div.textContent = i;
    div.dataset.pano = i;
    div.onclick = () => selectPano(i, div);
    grid.appendChild(div);
  }
}

function selectPano(num, el){
  // Seçimi güncelle
  document.querySelectorAll('.pno').forEach(d=>d.classList.remove('sel'));
  el.classList.add('sel');
  ST.selectedPano = 'PANEL - ' + String(num).padStart(2,'0');
  document.getElementById('manualInput').value = '';
  updateThumbInfo();
}

document.getElementById('manualInput').addEventListener('input', function(){
  if(this.value.trim()){
    document.querySelectorAll('.pno').forEach(d=>d.classList.remove('sel'));
    ST.selectedPano = this.value.trim();
    updateThumbInfo();
  } else {
    ST.selectedPano = null;
    updateThumbInfo();
  }
});

function updateThumbInfo(){
  const lbl = document.getElementById('selectedPanoLbl');
  const btn = document.getElementById('confirmBtn');
  if(ST.selectedPano && ST.pendingBlob){
    lbl.textContent = ST.selectedPano;
    btn.classList.add('active');
  } else if(ST.selectedPano){
    lbl.textContent = ST.selectedPano;
    btn.classList.remove('active');
  } else {
    lbl.textContent = '— seçilmedi —';
    btn.classList.remove('active');
  }
}

/* ── FOTOĞRAF ÇEK ── */
async function capturePhoto(){
  const vid = document.getElementById('video');
  const cvs = document.getElementById('canvas');
  const prev = document.getElementById('prevImg');
  const flash = document.getElementById('flash');

  if(!vid.videoWidth) return;

  // Flash efekti
  flash.style.opacity = '0.8';
  setTimeout(()=>{ flash.style.opacity='0'; }, 150);

  // Canvas'a çiz
  cvs.width = vid.videoWidth;
  cvs.height = vid.videoHeight;
  const ctx = cvs.getContext('2d');
  ctx.drawImage(vid, 0, 0);

  // Blob ve preview
  const blob = await new Promise(r=>cvs.toBlob(r,'image/jpeg',0.9));
  ST.pendingBlob = blob;

  // Küçük önizleme
  const url = URL.createObjectURL(blob);
  document.getElementById('thumb').src = url;
  document.getElementById('thumbWrap').style.display = 'flex';

  // Seçim sıfırla
  ST.selectedPano = null;
  document.querySelectorAll('.pno').forEach(d=>d.classList.remove('sel'));
  document.getElementById('manualInput').value = '';
  updateThumbInfo();

  setStatus('Pano numarasını seçin', '');

  // Pano alanına scroll
  document.getElementById('panoArea').scrollTo({top:0, behavior:'smooth'});
}

/* ── KAYDET (YEŞİL TİK) ── */
async function savePhoto(){
  if(!ST.pendingBlob || !ST.selectedPano) return;

  const key = ST.selectedPano;
  if(!ST.panels[key]) ST.panels[key] = [];
  const idx = ST.panels[key].length + 1;
  const fname = ST.siparis + '_' + key + '_' + String(idx).padStart(3,'0') + '.jpg';
  ST.panels[key].push({ name: fname, blob: ST.pendingBlob });
  ST.total++;

  // UI güncelle
  document.getElementById('hdrCnt').textContent = ST.total + ' fotoğraf';
  document.getElementById('zipBtn').disabled = false;
  setStatus('✓ Kaydedildi: ' + key, 'ok');

  // Temizle
  ST.pendingBlob = null;
  ST.selectedPano = null;
  document.getElementById('thumbWrap').style.display = 'none';
  document.getElementById('thumb').src = '';
  document.querySelectorAll('.pno').forEach(d=>d.classList.remove('sel'));
  document.getElementById('manualInput').value = '';
  document.getElementById('confirmBtn').classList.remove('active');

  // Kısa süre sonra mesajı temizle
  setTimeout(()=>setStatus('Sonraki fotoğrafı çekin',''), 1500);
}

/* ── STATUS ── */
function setStatus(msg, cls){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = cls ? 'ok' === cls ? 'ok' : cls : '';
  el.style.color = cls==='ok'?'var(--accent)':cls==='err'?'var(--red)':'var(--muted)';
}

/* ── BİTİŞ EKRANI ── */
function goToFinish(){
  const keys = Object.keys(ST.panels);
  const panelList = keys.map(k=>{
    return `${k}: ${ST.panels[k].length} fotoğraf`;
  }).join('\n');
  document.getElementById('doneSip').textContent = ST.siparis + ' — Tamamlandı';
  document.getElementById('doneStats').textContent =
    ST.total + ' fotoğraf, ' + keys.length + ' pano\n\n' + panelList;
  showScreen('doneScreen');
}

function backToScan(){
  showScreen('scanScreen');
}

/* ── ZIP ── */
async function downloadZip(){
  const btn = document.querySelector('#doneScreen .dbtn.primary');
  btn.textContent = 'HAZIRLANIYOR...'; btn.disabled = true;

  try{
    const zip = new JSZip();
    // Her pano için klasör
    for(const [key, files] of Object.entries(ST.panels)){
      const folder = zip.folder(key);
      for(const f of files) folder.file(f.name, f.blob);
    }
    // Panoya atanmamış resimler (manuel yazılmış özel isimler dahil)
    // — zaten hepsi klasöre gidiyor, bekleyen blob varsa ekle
    if(ST.pendingBlob){
      const fname = ST.siparis + '_BEKLEYEN.jpg';
      zip.file(fname, ST.pendingBlob);
    }

    const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = ST.siparis + '_Etiketler_' + new Date().toISOString().slice(0,10) + '.zip';
    a.click();
    setStatus('ZIP indirildi!', 'ok');
  }catch(e){
    alert('ZIP hatası: '+e.message);
  }
  btn.textContent = '⬇ ZIP İNDİR'; btn.disabled = false;
}

/* ── SIFIRLA ── */
function confirmReset(){
  if(ST.total === 0){ fullReset(); return; }
  if(confirm('Tüm fotoğraflar silinecek ve yeni siparişe geçilecek. Emin misiniz?')){
    fullReset();
  }
}

function fullReset(){
  ST.siparis=''; ST.panels={}; ST.total=0;
  ST.pendingBlob=null; ST.selectedPano=null;
  document.getElementById('sipInput').value='';
  document.getElementById('hdrCnt').textContent='0 fotoğraf';
  document.getElementById('zipBtn').disabled=true;
  document.getElementById('thumbWrap').style.display='none';
  showScreen('sipScreen');
}

/* ── INIT ── */
sizeCam();
</script>
</body>
</html>
