<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siemens Etiket Tarayıcı - V9</title>
    <style>
        :root {
            --bg-color: #121212; --surface-color: #1e1e1e;
            --primary-color: #009999; --text-main: #ffffff; --text-muted: #aaaaaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        #debug-log {
            position: absolute; bottom: 80px; left: 0; width: 100%; height: 90px; 
            background: rgba(0, 0, 0, 0.85); color: #00e676; font-family: monospace; 
            font-size: 11px; padding: 5px; overflow-y: auto; z-index: 9999; pointer-events: none;
        }

        #camera-container { flex: 1; background-color: #000; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }
        
        #preview-img {
            position: absolute; width: 100%; height: 100%; object-fit: contain;
            background-color: rgba(0,0,0,0.9); z-index: 20; display: none;
        }

        .scan-frame { position: absolute; width: 70%; height: 35%; border: 2px dashed rgba(255, 255, 255, 0.5); border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4); pointer-events: none; z-index: 10;}

        #start-cam-btn {
            position: absolute; z-index: 50; padding: 15px 30px; font-size: 16px; font-weight: bold;
            background-color: var(--primary-color); color: white; border: none; border-radius: 8px; cursor: pointer;
        }

        #action-bar { height: 80px; background-color: var(--surface-color); display: flex; justify-content: center; align-items: center; position: relative; z-index: 30; }
        #capture-btn { width: 64px; height: 64px; border-radius: 50%; background-color: #555; border: 4px solid var(--surface-color); outline: 2px solid #555; cursor: pointer; transition: transform 0.1s; pointer-events: none; }
        #capture-btn.active { background-color: var(--primary-color); outline-color: var(--primary-color); pointer-events: auto; }
        #capture-btn:active { transform: scale(0.95); }

        #list-container { flex: 1; background-color: var(--surface-color); padding: 15px; overflow-y: auto; z-index: 30; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .header-row h2 { font-size: 16px; font-weight: 600; color: var(--text-muted); }
        .counter { background-color: var(--primary-color); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 14px; font-weight: bold; }

        #api-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--surface-color); padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 15px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; }
        .modal-content button { width: 100%; padding: 10px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="debug-log">V9 Başlatıldı. Hedef: Latest Flash Model<br></div>

    <div id="api-modal" class="hidden">
        <div class="modal-content">
            <h3>API Ayarları</h3>
            <input type="text" id="api-key-input" placeholder="AIzaSy...">
            <button onclick="saveApiKey()">Kaydet ve Başla</button>
        </div>
    </div>

    <div id="camera-container">
        <button id="start-cam-btn" onclick="startCamera()">KAMERAYI AÇ</button>
        <video id="camera-feed" playsinline muted></video>
        <div class="scan-frame"></div>
        <img id="preview-img" alt="Yakalanan Kare">
    </div>

    <div id="action-bar">
        <button id="capture-btn" onclick="captureImage()"></button>
    </div>

    <div id="list-container">
        <div class="header-row">
            <h2>TARANAN PANOLAR</h2>
            <div class="counter" id="total-count">0</div>
        </div>
        <div id="scanned-list" style="color: var(--text-muted); font-size: 14px; text-align: center; margin-top: 20px;">Henüz tarama yapılmadı.</div>
    </div>

    <script>
        const logDiv = document.getElementById('debug-log');
        function sysLog(msg) {
            logDiv.innerHTML += `> ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function checkApiKey() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                document.getElementById('api-modal').classList.remove('hidden');
            } else {
                sysLog("Key hazır. Kamerayı açın.");
            }
        }

        function saveApiKey() {
            const input = document.getElementById('api-key-input').value.trim();
            if (input) {
                localStorage.setItem('gemini_api_key', input);
                document.getElementById('api-modal').classList.add('hidden');
                sysLog("Key kaydedildi.");
            }
        }

        async function startCamera() {
            const btn = document.getElementById('start-cam-btn');
            btn.innerText = "Yükleniyor...";
            const videoElement = document.getElementById('camera-feed');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = () => { 
                    videoElement.play(); 
                    sysLog(`Kamera Aktif`);
                    btn.style.display = "none";
                    document.getElementById('capture-btn').classList.add('active');
                };
            } catch (err) {
                sysLog("Kamera Hatası: " + err.message);
                btn.innerText = "TEKRAR DENE";
            }
        }

        let totalScanned = 0;

        async function captureImage() {
            const video = document.getElementById('camera-feed');
            const btn = document.getElementById('capture-btn');
            const previewImg = document.getElementById('preview-img');
            const apiKey = localStorage.getItem('gemini_api_key');

            if (!apiKey) return;

            btn.style.backgroundColor = "orange";
            btn.classList.remove('active');

            try {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800;
                const scaleSize = MAX_WIDTH / video.videoWidth;
                
                canvas.width = MAX_WIDTH;
                canvas.height = video.videoHeight * scaleSize;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const dataURL = canvas.toDataURL('image/jpeg', 0.7);
                previewImg.src = dataURL; 
                previewImg.style.display = "block";
                
                const imageData = dataURL.split(',')[1];
                
                const promptText = "Görseldeki Siemens etiketini oku. Sadece JSON formatında şu alanları ver: siparis_no, upper_list, part_no, panel_no.";
                
                // --- İŞTE DÜZELTİLEN YER: gemini-1.5-flash-latest kullanıyoruz ---
                const apiUrl = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=" + apiKey;

                const requestBody = JSON.stringify({
                    contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: "image/jpeg", data: imageData } }] }]
                });

                let attempt = 0;
                let maxAttempts = 3;
                let success = false;

                while (attempt < maxAttempts && !success) {
                    attempt++;
                    sysLog(`İstek atılıyor (Deneme ${attempt}/${maxAttempts})...`);
                    
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: requestBody
                    });

                    if (response.status === 503) {
                        sysLog("Sunucu yoğun (503). Bekleniyor...");
                        await new Promise(resolve => setTimeout(resolve, 1500));
                        continue; 
                    }

                    if (!response.ok) {
                        const errorText = await response.text();
                        sysLog(`API Hatası ${response.status}: ${errorText.substring(0,40)}`);
                        break; 
                    }

                    const data = await response.json();
                    
                    if (data.error) {
                        sysLog("API REDDETTİ: " + data.error.message);
                        break;
                    }
                    
                    if (data.candidates && data.candidates[0].content) {
                        let rawText = data.candidates[0].content.parts[0].text;
                        let cleanText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                        try {
                            let result = JSON.parse(cleanText);
                            let panoNo = result.panel_no || "Accessories Kit";
                            if (panoNo.toString().trim() === "") panoNo = "Accessories Kit";
                            sysLog("BAŞARILI: Pano " + panoNo);
                            addToList(result.siparis_no, panoNo, result.part_no);
                            success = true; 
                        } catch (e) {
                            sysLog("JSON Hatası: " + cleanText.substring(0, 20));
                            break;
                        }
                    } else {
                        sysLog("Yanıt Boş.");
                        break;
                    }
                }

                if (!success && attempt >= maxAttempts) {
                    sysLog("HATA: Tüm denemeler başarısız oldu.");
                }

            } catch (error) {
                sysLog("ÇÖKME: " + error.message);
            } finally {
                setTimeout(() => { previewImg.style.display = "none"; }, 1500);
                btn.style.backgroundColor = "";
                btn.classList.add('active');
            }
        }

        function addToList(siparis, pano, parca) {
            const listContainer = document.getElementById('scanned-list');
            if (totalScanned === 0) listContainer.innerHTML = "";
            totalScanned++;
            document.getElementById('total-count').innerText = totalScanned;
            const item = document.createElement('div');
            item.style.backgroundColor = "#2a2a2a"; item.style.padding = "10px"; item.style.marginBottom = "10px"; item.style.borderRadius = "6px"; item.style.borderLeft = "4px solid var(--primary-color)";
            item.innerHTML = "<div style='font-weight: bold; color: white; margin-bottom: 4px;'>Pano: " + pano + "</div><div style='font-size: 12px; color: var(--text-muted);'>Sipariş: " + siparis + " | Parça: " + parca + "</div>";
            listContainer.prepend(item);
        }

        window.onload = checkApiKey;
    </script>
</body>
</html>
